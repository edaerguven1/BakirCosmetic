<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakır Cosmetic | Ürün Yönetim Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&family=Syne:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f0f2f5;
            color: #333;
            overflow-x: hidden;
            cursor: auto;
            /* Reset custom cursor for admin */
        }

        .admin-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        .panel {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--color-copper);
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: var(--font-body);
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--color-copper);
            outline: none;
        }

        .btn-primary {
            background: var(--color-copper);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: var(--color-copper-light);
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-height: 80vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        .product-item {
            background: white;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .product-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
        }

        .p-details h4 {
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .p-details p {
            font-size: 0.8rem;
            color: #888;
        }

        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #ff4d4f;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
        }

        /* Bulk Import Area */
        .bulk-area {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .code-output {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            transform: translateY(100%);
            transition: 0.3s;
            z-index: 1000;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.2);
            font-family: monospace;
        }

        .code-output.active {
            transform: translateY(0);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .action-btns button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-left: 10px;
        }

        .btn-copy {
            background: #4cd964;
            color: white;
        }

        .btn-close {
            background: #666;
            color: white;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #888;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--color-copper);
            border-bottom-color: var(--color-copper);
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="admin-container">
        <!-- Sidebar / Editor -->
        <div class="panel editor-panel">
            <div class="tabs" style="margin-bottom: 20px; border-bottom: 1px solid #eee;">
                <button class="tab-btn active" onclick="switchTab('single')">Tekli Ekle</button>
                <button class="tab-btn" onclick="switchTab('bulk')">Toplu Resimden Ekle</button>
            </div>

            <!-- Single Add Form -->
            <div id="tab-single">
                <div class="form-group">
                    <label>Ürün Adı</label>
                    <input type="text" id="p-name" placeholder="Örn: Morfose Fön Suyu">
                </div>

                <div class="form-group">
                    <label>Marka</label>
                    <select id="p-brand" onchange="toggleCustomBrand('p')">
                        <option value="Schwarzkopf">Schwarzkopf</option>
                        <option value="L'Oreal">L'Oreal</option>
                        <option value="Wella">Wella</option>
                        <option value="Davines">Davines</option>
                        <option value="Morfose">Morfose</option>
                        <option value="Kerastase">Kerastase</option>
                        <option value="Dyson">Dyson</option>
                        <option value="Bakır Design">Bakır Design</option>
                        <option value="Diğer">Diğer (Yeni Marka)</option>
                    </select>
                    <input type="text" id="p-brand-custom" placeholder="Marka Adını Yazın"
                        style="display:none; margin-top:10px;">
                </div>

                <div class="form-group">
                    <label>Kategori</label>
                    <select id="p-category">
                        <option value="">Kategori Seçin</option>

                        <optgroup label="Saç Renklendirme">
                            <option value="hair-dye">Saç Boyaları</option>
                            <option value="bleach">Saç Açıcılar</option>
                            <option value="oxidant">Oksidanlar</option>
                            <option value="spray-dye">Sprey Boyalar - Wax</option>
                        </optgroup>

                        <optgroup label="Saç Şekillendirme">
                            <option value="styling-spray">Spreyler</option>
                            <option value="foam">Köpükler</option>
                            <option value="wax-gel">Wax - Jöle</option>
                        </optgroup>

                        <optgroup label="Saç Bakım">
                            <option value="shampoo">Şampuanlar</option>
                            <option value="conditioner">Saç Kremleri</option>
                            <option value="mask">Saç Maskeleri</option>
                            <option value="blow-dry-water">Fön Suları</option>
                            <option value="dry-shampoo">Kuru Şampuanlar</option>
                            <option value="care-oil">Bakım Yağları</option>
                            <option value="tonic">Saç Tonikleri</option>
                            <option value="serum">Serumlar</option>
                            <option value="protein-care">Protein Bakım</option>
                        </optgroup>

                        <optgroup label="Erkek Bakım">
                            <option value="men-hair-care">Saç Bakım</option>
                            <option value="beard-care">Sakal Bakım</option>
                            <option value="skin-care">Cilt Bakım</option>
                            <option value="men-hair-dye">Saç Boyaları</option>
                            <option value="men-perfume">Parfüm</option>
                        </optgroup>

                        <optgroup label="Kişisel Bakım">
                            <option value="perfume">Parfüm</option>
                            <option value="lotion">Losyonlar</option>
                            <option value="cleanser">Temizleyiciler</option>
                        </optgroup>

                        <optgroup label="Aksesuarlar">
                            <option value="hair-accessories">Saç Aksesuarları</option>
                            <option value="tech">Teknik Cihazlar</option>
                            <option value="furniture">Demirbaş</option>
                        </optgroup>
                    </select>
                </div>

                <div class="form-group">
                    <label>Resim Yolu</label>
                    <input type="text" id="p-image" placeholder="assets/products/marka/dosya.jpg">
                    <small style="color:#888; display:block; margin-top:5px;">İpucu: Sadece dosya adını yazarsanız
                        'assets/products/marka/' otomatik eklenir.</small>
                </div>

                <div class="form-group">
                    <label>Açıklama</label>
                    <textarea id="p-desc" rows="3" placeholder="Ürün açıklaması..."></textarea>
                </div>

                <button class="btn-primary" onclick="addProduct()">Listeye Ekle</button>
            </div>

            <!-- Bulk Add Form -->
            <div id="tab-bulk" style="display: none;">
                <p style="font-size:0.9rem; color:#666; margin-bottom:15px;">
                    Klasördeki resim adlarını alt alta yapıştırın. Sistem otomatik ürün oluşturur.
                </p>

                <div class="form-group">
                    <label>Marka (Hepsi için geçerli)</label>
                    <select id="b-brand" onchange="toggleCustomBrand('b')">
                        <option value="Morfose">Morfose</option>
                        <option value="Schwarzkopf">Schwarzkopf</option>
                        <option value="L'Oreal">L'Oreal</option>
                        <option value="Wella">Wella</option>
                        <option value="Davines">Davines</option>
                        <option value="Kerastase">Kerastase</option>
                        <option value="Diğer">Diğer (Yeni Marka)</option>
                    </select>
                    <input type="text" id="b-brand-custom" placeholder="Marka Adını Yazın"
                        style="display:none; margin-top:10px;">
                </div>

                <div class="form-group">
                    <label>Kategori</label>
                    <select id="b-category">
                        <option value="">Kategori Seçin</option>

                        <optgroup label="Saç Renklendirme">
                            <option value="hair-dye">Saç Boyaları</option>
                            <option value="bleach">Saç Açıcılar</option>
                            <option value="oxidant">Oksidanlar</option>
                            <option value="spray-dye">Sprey Boyalar - Wax</option>
                        </optgroup>

                        <optgroup label="Saç Şekillendirme">
                            <option value="styling-spray">Spreyler</option>
                            <option value="foam">Köpükler</option>
                            <option value="wax-gel">Wax - Jöle</option>
                        </optgroup>

                        <optgroup label="Saç Bakım">
                            <option value="shampoo">Şampuanlar</option>
                            <option value="conditioner">Saç Kremleri</option>
                            <option value="mask">Saç Maskeleri</option>
                            <option value="blow-dry-water">Fön Suları</option>
                            <option value="dry-shampoo">Kuru Şampuanlar</option>
                            <option value="care-oil">Bakım Yağları</option>
                            <option value="tonic">Saç Tonikleri</option>
                            <option value="serum">Serumlar</option>
                            <option value="protein-care">Protein Bakım</option>
                        </optgroup>

                        <optgroup label="Erkek Bakım">
                            <option value="men-hair-care">Saç Bakım</option>
                            <option value="beard-care">Sakal Bakım</option>
                            <option value="skin-care">Cilt Bakım</option>
                            <option value="men-hair-dye">Saç Boyaları</option>
                            <option value="men-perfume">Parfüm</option>
                        </optgroup>

                        <optgroup label="Kişisel Bakım">
                            <option value="perfume">Parfüm</option>
                            <option value="lotion">Losyonlar</option>
                            <option value="cleanser">Temizleyiciler</option>
                        </optgroup>

                        <optgroup label="Aksesuarlar">
                            <option value="hair-accessories">Saç Aksesuarları</option>
                            <option value="tech">Teknik Cihazlar</option>
                            <option value="furniture">Demirbaş</option>
                        </optgroup>
                    </select>
                </div>

                <div class="form-group">
                    <label>Dosya Listesi</label>
                    <textarea id="b-files" rows="10"
                        placeholder="image1.jpg&#10;image2.png&#10;urun_resmi.webp"></textarea>
                </div>

                <button class="btn-primary" onclick="bulkAdd()">Hepsini Ekle</button>
            </div>
        </div>

        <!-- List Panel -->
        <div class="panel">
            <div class="toolbar">
                <h2>Ürün Listesi</h2>
                <div class="action-btns">
                    <button class="btn-primary" style="background:#222;" onclick="generateCode()">KODU OLUŞTUR &
                        KOPYALA</button>
                </div>
            </div>

            <div class="stats">
                <span id="total-count">Toplam: 0 Ürün</span>
            </div>

            <div class="product-list" id="list-container">
                <!-- Items injected here -->
            </div>
        </div>
    </div>

    <!-- Code Output Modal -->
    <div class="code-output" id="output-modal">
        <div class="toolbar">
            <h3 style="margin:0; color:white;">Oluşturulan Kod</h3>
            <div class="action-btns">
                <button class="btn-copy" onclick="copyToClipboard()">Kopyalandı!</button>
                <button class="btn-close"
                    onclick="document.getElementById('output-modal').classList.remove('active')">Kapat</button>
            </div>
        </div>
        <p style="color:#aaa; font-size:0.9rem; margin-bottom:10px;">Aşağıdaki kodu data/products_db.js dosyasındaki her
            şeyin yerine yapıştırın.</p>
        <textarea id="final-code"
            style="width:100%; height:200px; background:#333; color:#eee; border:none; font-family:monospace; padding:15px;"></textarea>
    </div>

    <!-- Load existing data -->
    <script src="data/products_db.js"></script>
    <script>
        let products = [];

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            if (window.PRODUCT_DATA) {
                products = window.PRODUCT_DATA;
                renderList();
            } else {
                products = [];
            }
        });

        // Switch Tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('#tab-single, #tab-bulk').forEach(d => d.style.display = 'none');

            event.target.classList.add('active');
            document.getElementById('tab-' + tab).style.display = 'block';
        }

        // Render List
        function renderList() {
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            document.getElementById('total-count').textContent = `Toplam: ${products.length} Ürün`;

            // Sort by newest (added last) first for editing convenience? Or standard order?
            // Let's keep standard order but reverse rendering visually
            [...products].reverse().forEach((p, index) => {
                // Find actual index in original array
                const realIndex = products.length - 1 - index;

                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <img src="${p.image}" onerror="this.src='https://placehold.co/100?text=No+Img'">
                    <div class="p-details">
                        <h4>${p.name}</h4>
                        <p>${p.brand} | ${p.category}</p>
                        <p style="font-family:monospace; color:#aaa;">${p.image}</p>
                    </div>
                    <button class="btn-delete" onclick="removeProduct(${realIndex})"><i class="fa-solid fa-trash"></i></button>
                `;
                container.appendChild(item);
            });
        }

        // Toggle Custom Brand Input
        function toggleCustomBrand(prefix) {
            const select = document.getElementById(prefix + '-brand');
            const input = document.getElementById(prefix + '-brand-custom');

            if (select.value === 'Diğer') {
                input.style.display = 'block';
                input.focus();
            } else {
                input.style.display = 'none';
            }
        }

        // Add Single
        function addProduct() {
            const brandSelect = document.getElementById('p-brand').value;
            const brandCustom = document.getElementById('p-brand-custom').value;

            const Brand = (brandSelect === 'Diğer') ? brandCustom : brandSelect;

            if (!Brand) {
                alert('Lütfen bir marka seçin veya yazın.');
                return;
            }

            const Category = document.getElementById('p-category').value;
            let ImagePath = document.getElementById('p-image').value;

            // Auto-path logic
            if (!ImagePath.includes('/')) {
                const brandFolder = Brand.toLowerCase().replace(/[\s']/g, ''); // Simple cleanup
                ImagePath = `assets/products/${brandFolder}/${ImagePath}`;
            }

            const newProduct = {
                id: 'p' + (Date.now() + Math.random().toString().slice(2, 5)),
                name: document.getElementById('p-name').value || (Brand + ' Ürün'),
                category: Category,
                brand: Brand,
                image: ImagePath,
                description: document.getElementById('p-desc').value || 'Profesyonel kozmetik ürünü.'
            };

            products.push(newProduct);
            renderList();

            // Clear inputs
            document.getElementById('p-name').value = '';
            document.getElementById('p-image').value = '';
            // Reset brand selection if desired, or keep for multiple adds
        }

        // Bulk Add
        function bulkAdd() {
            const brandSelect = document.getElementById('b-brand').value;
            const brandCustom = document.getElementById('b-brand-custom').value;

            const Brand = (brandSelect === 'Diğer') ? brandCustom : brandSelect;

            if (!Brand) {
                alert('Lütfen bir marka seçin veya yazın.');
                return;
            }

            const Category = document.getElementById('b-category').value;
            const Files = document.getElementById('b-files').value.split('\n');

            Files.forEach(file => {
                const fileName = file.trim();
                if (fileName.length < 3) return; // Skip empty lines

                // Guess name from filename (remove extension and replacement chars)
                let cleanName = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
                cleanName = cleanName.replace(/[_-]/g, ' ');
                // Capitalize
                cleanName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);

                const brandFolder = Brand.toLowerCase().replace(/[\s']/g, '');

                const newProduct = {
                    id: 'p' + Date.now() + Math.floor(Math.random() * 1000),
                    name: Brand + ' ' + cleanName,
                    category: Category,
                    brand: Brand,
                    image: `assets/products/${brandFolder}/${fileName}`,
                    description: `${Brand} markasından profesyonel ${cleanName}.`
                };

                products.push(newProduct);
            });

            renderList();
            alert(`${Files.length} ürün eklendi!`);
            document.getElementById('b-files').value = '';
        }

        // Remove
        function removeProduct(index) {
            if (confirm('Bu ürünü silmek istediğinize emin misiniz?')) {
                products.splice(index, 1);
                renderList();
            }
        }

        // Generate Code
        function generateCode() {
            const json = JSON.stringify(products, null, 4);
            const finalString = `window.PRODUCT_DATA = ${json};\n`;

            const textarea = document.getElementById('final-code');
            textarea.value = finalString;

            document.getElementById('output-modal').classList.add('active');

            // Auto copy
            textarea.select();
            document.execCommand('copy');
        }

        function copyToClipboard() {
            const textarea = document.getElementById('final-code');
            textarea.select();
            document.execCommand('copy');
            alert('Kod kopyalandı! Şimdi data/products_db.js dosyasına yapıştırabilirsiniz.');
        }
    </script>
</body>

</html>
